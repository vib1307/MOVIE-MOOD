# Shared proxy settings. Installed to /etc/nginx/snippets/moviemood-proxy.conf

proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;

# Gradio streams results over SSE (and websockets in some versions): don't buffer.
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $connection_upgrade;  # map in the site file
proxy_buffering off;
proxy_cache off;

# Step 2/3 can take a while on a CPU-only LLM.
proxy_read_timeout 300s;
proxy_send_timeout 300s;
