# systemd drop-in for the Ollama service created by Ollama's install script.
# Installed by deploy/setup.sh to /etc/systemd/system/ollama.service.d/override.conf

[Service]
# Only the app on this box talks to Ollama; never expose it publicly.
Environment="OLLAMA_HOST=127.0.0.1:11434"
# Keep the models loaded (nomic; plus a local LLM if one is used), so users don't wait
# for a reload.
Environment="OLLAMA_KEEP_ALIVE=24h"
# One LLM request at a time (the UI's "llm" queue is already limited to 1).
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_MAX_LOADED_MODELS=2"
