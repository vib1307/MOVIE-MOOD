# nginx site for MovieMood. Installed by deploy/setup.sh with DOMAIN filled in;
# certbot --nginx later adds the 443/HTTPS server block and the 80 -> 443 redirect.

# Per-IP rate limits: one CPU-bound LLM serves everyone, so nobody gets to hog it.
# API: each call runs the LLM. UI: every search joins the queue 3 times (steps 1-3).
limit_req_zone $binary_remote_addr zone=mm_api:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=mm_ui:10m rate=30r/m;
limit_req_status 429;

# websocket upgrade only when the client asks for it; plain keep-alive otherwise
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    client_max_body_size 1m;

    location = /api/v1/recommend {
        limit_req zone=mm_api burst=3 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/moviemood-proxy.conf;
    }

    location = /gradio_api/queue/join {
        limit_req zone=mm_ui burst=10 nodelay;
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/moviemood-proxy.conf;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        include /etc/nginx/snippets/moviemood-proxy.conf;
    }
}
